name: main invariant sweep

# #4257: 5 of the whole-tree gate scripts (bare-tests-import-reference,
# fastmcp-import-boundary, file-depth-reference, tests-path-literal-reference,
# flat-tests-ratchet) normally run on `pull_request` only. With strict=false
# (#4239) a PR merges on its own green, so a violation created by the
# COMBINATION of two independently-green PRs is never caught at merge time —
# the next PR to touch that path inherits a red gate an innocent change
# didn't cause. This workflow re-runs those 5 against `main` on an hourly
# schedule (plus workflow_dispatch for an on-demand check) so that
# composition gap has a witness, without adding `push: branches: [main]` to
# the 5 existing per-PR workflows (owner: keep this in ONE new file, don't
# touch them).
#
# #4965/#4966 adds a 6th, collect-events-settle
# (collect-events-settle-gate.yml) — same reasoning, and its own
# `pull_request` trigger is additionally PATH-scoped (tests/**,
# src/reyn/core/events/**), so the composition gap this workflow closes is
# even easier to hit for it: two independently-green PRs that each touch
# only ONE of those two paths never trigger the per-PR gate at all for the
# OTHER path's half of the violation.
#
# Deliberately only 5+1 of #4257's original scan — one other candidate,
# tests-dir-names-gate, invokes its script with a diff/merge-base argument
# (`--base origin/<PR base ref>` / a merge-base comparison) that has no
# meaning against `main` alone: there is no "PR" here to diff against, and
# passing any other ref would not actually stand in for one. Left out, not
# silently dropped — see the PR body for the same reasoning recorded where
# a reviewer will read it. (#4257's scan actually found 7 candidates; the
# 7th, migration-diff-shape-gate, was the SAME shape as tests-dir-names-gate
# here and excluded for the same reason — it no longer exists at all,
# removed by #4492 once #3879 Stage 1 completed and the gate's own
# `removed_by` condition was met.)
#
# `check-pr-closing-intent` / `dogfood-finding-triage` are excluded for the
# same reason #4257's issue body gives: the former inspects a PR body (main
# has no such artifact — running it would be an always-green check watching
# nothing), the latter isn't `pull_request`/`push`-triggered at all.
#
# #6117: `litellm-proxy-patch-scaffold.yml` / `check-doc-drift-fixture.yml`
# are NOT folded into the step list below either, though both CAN run
# against `main` alone (neither needs a PR diff) — unlike the exclusions
# above, this is a fit problem with THIS job, not a meaning problem with
# them: `litellm-proxy-patch-scaffold` needs an ISOLATED Python 3.13 venv
# carrying ONLY `litellm[proxy]==1.95.0` + pytest (owner ruling, #5620:
# deliberately excludes reyn's own [dev]/[mcp]/[web] extras), which this
# job's single shared Python-3.11-plus-`pip install -e .` environment
# cannot host without breaking that isolation; `check-doc-drift-fixture`
# needs `fetch-depth: 0` (full git history, for `git show <pinned-sha>:
# <path>`) on ITS checkout, while this job's own checkout is shallow
# (lead-coder ruling, #5298: paying full-clone cost on every hourly/every-
# push run for 2 rarely-touched files was rejected there for the same
# reason it would be rejected here). Both ALREADY have their own
# `push: branches: [main]` leg (path-scoped to the same files their
# `pull_request` trigger watches) — narrower than this sweep's
# unconditional-every-push coverage, but real: a push to `main` that
# touches either gate's own watched files re-runs it independently of
# this file. Neither is a whole-tree gate over unrelated files the way the
# 9+14 gates above are, so the composition-gap risk this workflow exists
# to close is structurally small for both to begin with.
#
# Deliberately NOT a required status check (not referenced from branch
# protection) — this runs on a schedule independent of any one PR, so
# folding its result into a PR's merge gate would block merges on an
# unrelated periodic run.
#
# #5479 (architect, self-correcting #5435/#5466's own acceptance basis):
# `schedule` alone measured 2.7-12.8h between runs (GitHub's scheduler
# under load), not the ~1h a reader of "hourly" would assume — the
# composition-gap witness this workflow exists to provide could lag a
# real break by up to ~13h. `push: branches: [main]` is ADDED below
# (schedule stays, as the backstop for a run GitHub's scheduler drops
# entirely) so the same sweep also runs once per merge, with no delay.
# Cost: 1 extra workflow run per merge to main, a SINGLE job running its
# steps in sequence (never a matrix) — a different order of magnitude
# from #4239's saturation concern, and #4257's owner ruling ("don't
# touch the 5 existing per-PR workflows, keep this in one new file") is
# untouched — only this one file's own trigger changes. (This paragraph
# was written for #5479, against the step list as it stood then — see
# the step list below for the current count; not restated here, see
# the naming-rationale section below for why.)
# `pytest` itself (test.yml, `on: push: branches: [main]`) already runs
# with no delay; only these path-scoped, whole-tree gates (see the step
# list below for the current count — not restated here) were ever
# subject to the ~13h lag — never read this fix as "main could go a
# half-day without any signal at all".
#
# #5480: renamed from "main-hourly-gate-sweep" (file and both `name:`
# fields) — "hourly" was already false the moment #5479 added `push`
# above (this sweep no longer has one single cadence). "invariant
# sweep" names what every step below shares — each checks a fact about
# `main` that must always hold — without committing to a cadence word
# a future trigger change could falsify again, or to a step COUNT a
# future step addition could falsify (lead-coder: cadence を名前に入れ
# ない — a naming rule, not a one-off choice, for whoever edits this
# file next; the step list below is the only place a count is ever
# worth reading, never restated in prose here).
#
# #5480 was ALSO going to fold in `branch-protection-strict-stays-off`
# as a step here — NOT done (architect BLOCKING, live-verified): that
# standalone workflow ran 35/35 times since its own same-day addition
# (#5435) and FAILED every time — `gh: Resource not accessible by
# integration (HTTP 403)`. The default `GITHUB_TOKEN` cannot read
# branch protection at all (`administration` is not grantable via any
# workflow's own `permissions:` block the way `contents: read` is), so
# that check never once observed its own subject — its own former
# "has no false positives" claim was false from the moment it was
# written. Folding it in AS-IS would have made every run of THIS
# sweep red from the moment this PR merged, and that red would have
# said nothing about the other whole-tree gates this sweep exists to
# witness — destroying the thing #5479 just fixed.
#
# #5487/#5488 (owner + lead-coder, 2026-09-04): resolved as "abandon,
# don't route around" — `administration: read` needs a PAT/GitHub App
# only the owner can issue (not a `permissions:` block), the value
# being watched (`required_status_checks.strict`) cannot change on its
# own (a branch-protection setting only an admin — here, the owner —
# can flip), and a week with the gate silently broken carried no
# symptom. `branch-protection-strict-stays-off.yml` was DELETED, not
# left broken-and-filed-separately: this repo currently has NO
# machine watching `strict`. The owner's own `strict=false` policy
# (#4239) is unchanged and still in force — what changed is only that
# nothing mechanical asserts it anymore. re-open trigger: a token with
# `administration: read` becomes available.
#
# #6014 (2026-09-10): this workflow had NO `pip install` step at all, and
# that absence was an UNWRITTEN contract — every gate enumerated here
# happened to be stdlib-only, so nothing ever needed one. `52344e916`
# added 3 gates that import `reyn` itself, and every run since failed
# with `ModuleNotFoundError: No module named 'reyn'` (28 of 28 runs,
# ~20h, read off each run's own step list). The install step below makes
# the requirement explicit instead of accidental.
#
# Two things that were NOT the cause, recorded because both were asserted
# before those step lists were opened:
#   - The other gates did NOT go silent. All 28 failing runs show
#     success=9 / failure=3 — `if: ${{ !cancelled() }}` on every step
#     (see the step section below) contained the failure exactly as
#     #4257 intended. A job-level red does not imply step-level silence,
#     and the job conclusion alone cannot tell them apart.
#   - The 3 gates reported NO invariant violation. They never got far
#     enough to look: all 3 died on their own `import reyn` line. A gate
#     that never reached its subject says nothing about that subject —
#     the "green over an empty collection" hazard, wearing red's colour.
#
# Rejected, with the reason, so it is not re-proposed: splitting this
# into a static job and an install-requiring job. Its only stated benefit
# — "the install-free gates keep reporting when install breaks" — is
# already delivered by step-level `!cancelled()` above, so the split
# bought nothing this file did not already have.
on:
  schedule:
    # GitHub's own scheduler is best-effort under load — "roughly hourly",
    # not "always at :00". See the module comment above for why that's fine
    # here (this is a composition-gap witness, not a merge gate) — kept as
    # the backstop for a run GitHub's scheduler drops entirely, alongside
    # `push` below (#5479).
    - cron: "0 * * * *"
  # #5479: runs the same sweep once per merge to main, with no delay —
  # `schedule` alone could lag a real composition break by up to ~13h
  # (measured). See the module comment above for the full account.
  push:
    branches: [main]
  workflow_dispatch: {}
  # #6014 charter Q1: callable from `main-sweep-mirror.yml`. That workflow
  # runs this SAME job against a PR's merge result, and ONLY when main's own
  # sweep for that PR's base commit was red — the escape hatch that keeps a
  # required mirror from deadlocking the very PR that fixes the break (a
  # plain "required status" has no such hatch: the fixing PR is blocked by
  # the red it is fixing). `workflow_call` rather than a second copy of the
  # step list, deliberately: a copy is a hand-maintained population and goes
  # stale the first time a gate is added here and not there.
  workflow_call: {}

permissions:
  contents: read

jobs:
  gate-sweep:
    name: main invariant sweep
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # #6014: FIRST, ahead of every gate — deliberately not "just before
      # the 3 that need it". Nothing enforces step order, so a step
      # inserted above them later would silently reopen the same hole;
      # installing at the head closes the class rather than the instance
      # (lead-coder ruling on #6014).
      #
      # `-c ci-constraints.txt` (#5831): the same reproducibility pin
      # every other job that installs project dependencies uses — see
      # test.yml's "Install dependencies" step for why.
      #
      # Base install, no extras: the 3 gates below import
      # `reyn.security.permissions.approval_ledger`,
      # `reyn.hooks.schema_registry` and `reyn.interfaces.repl.read_model`,
      # all reachable from the base dependency set. Extras would widen
      # what a resolver failure can take down with no gate asking for it.
      #
      # `timeout 8m` (#3670's idiom, #6014's reason): this is the first
      # step in this file that can HANG — `textual-flowview` is a
      # `git+https` dependency, so a clone can stall indefinitely, and pip
      # resolution can backtrack. Installing at the head (above) is what
      # makes that matter: a hang here burns the job's own
      # `timeout-minutes: 10`, and a job killed by `timeout-minutes`
      # reports `cancelled`, not `failure` — which makes
      # `if: ${{ !cancelled() }}` on every gate below FALSE and skips all
      # twelve. That is strictly worse than a red gate: a red one is
      # legible, a skipped one says nothing at all. `timeout` turns the
      # same hang into an ordinary non-zero step exit (124), so the job
      # is never `cancelled` and every gate below still runs and reports.
      #
      # Where 8m comes from — derived, not picked:
      #   budget                                              600s
      #   - everything else, worst case within the 28 red runs -32s
      #       (sum of each step's own observed maximum, which is
      #        pessimistic on purpose: no single run was that slow —
      #        the worst OBSERVED whole-job total was 24s)
      #   - the 3 gates below actually doing their work            -5s
      #       (they died on `import reyn` in all 28 of those runs, so
      #        their real cost is absent from the measurement above;
      #        0.15-0.36s each measured locally, 5s is CI headroom)
      #   - margin                                              -83s
      #   = 480s = 8m
      #
      # The margin exists because an observed maximum is not an upper
      # bound: 28 runs sample ONE tree state, the API reports step
      # durations at 1-second granularity, and a loaded runner is slower
      # than any of them. 8m is also ~3x a cold install of this
      # dependency set, so it fires on a hang and never on a slow-but-
      # working one.
      #
      # `cache: pip` above makes the two cases differ a lot: a WARM run
      # reinstalls from cached wheels, a COLD one (first run after this
      # file, `pyproject.toml` or `ci-constraints.txt` changes, or after
      # the cache expires) downloads and builds everything AND clones
      # `textual-flowview` over the network. 8m is sized for the cold
      # case — do not re-derive it from a warm run's duration.
      - name: Install reyn (the gates below that import it need this)
        run: timeout 8m pip install -e . -c ci-constraints.txt

      # Most steps below are stdlib-only (ast / pathlib / sys), same as
      # their per-PR counterparts; the last 3 import `reyn` itself and
      # need the install above. Do not read "no install needed" off the
      # first nine and drop that step — #6014 is what that costs.
      # Any non-zero exit fails its own step (default `run:` behaviour),
      # which reddens the job overall — a single red gate is enough,
      # #4257's own test-plan requirement ("a red gate you can't fail is a
      # gate that says nothing"). Every step still carries
      # `if: ${{ !cancelled() }}` so an earlier step's failure does NOT
      # skip the later ones (the default without it) — this runs at most
      # once an hour on the schedule side, so knowing every step's own
      # outcome from one run matters more here than in a per-PR gate:
      # without it, only the first failure is visible and recovery has to
      # wait a full cycle to learn about the rest.
      - name: bare-tests-import-reference
        if: ${{ !cancelled() }}
        run: python scripts/check_bare_tests_import_reference.py

      - name: fastmcp-import-boundary
        if: ${{ !cancelled() }}
        run: python scripts/check_fastmcp_import_boundary.py

      - name: file-depth-reference
        if: ${{ !cancelled() }}
        run: python scripts/check_file_depth_reference.py

      - name: tests-path-literal-reference
        if: ${{ !cancelled() }}
        run: python scripts/check_tests_path_literal_reference.py

      - name: subprocess-reyn-pin
        if: ${{ !cancelled() }}
        run: python scripts/check_subprocess_reyn_pin.py

      - name: flat-tests-ratchet
        if: ${{ !cancelled() }}
        run: python scripts/flat_tests_ratchet.py

      - name: collect-events-settle
        if: ${{ !cancelled() }}
        run: python scripts/check_collect_events_settle.py

      - name: cancel-swallow
        if: ${{ !cancelled() }}
        run: python scripts/check_cancel_swallow.py

      - name: no-hardcoded-compaction-role-tuple
        if: ${{ !cancelled() }}
        run: python scripts/check_no_hardcoded_compaction_role_tuple.py

      # #6014 stage C: these 3 were never in this file's enumeration and
      # not referenced from any CLAUDE.md path-conditional line either —
      # written, but never actually run against the real tree since the
      # day each landed (their own `tests/` coverage only drives the
      # detector against a synthetic `tmp_path` fixture, never the real
      # tree).
      #
      # The "all 3 measured rc=0 against main" that justified adding them
      # was taken in an environment where `reyn` was already importable —
      # not in this workflow's environment, which had no install at all.
      # The measurement was true and the conclusion drawn from it was
      # false: an rc=0 carries the interpreter it was taken on as much as
      # the tree. The install step above is what makes these 3 lines mean
      # what they say.
      - name: approval-ledger-import-boundary
        if: ${{ !cancelled() }}
        run: python scripts/check_approval_ledger_import_boundary.py

      - name: hooks-declared-reachable
        if: ${{ !cancelled() }}
        run: python scripts/check_hooks_declared_reachable.py

      - name: remote-snapshot-placeholder-declared
        if: ${{ !cancelled() }}
        run: python scripts/check_remote_snapshot_placeholder_declared.py

      # #6117 (lead-coder, split from #6113): 17 path-filtered, per-PR-only
      # gates had NO discovery path for the SAME composition-gap class
      # #4257 named above — a PR touching neither of two files that
      # together violate one of these gates never triggers it, and (unlike
      # the 9 gates above) nothing else re-checked them against `main`
      # either. Measured runnable against `main` alone (no PR/diff context
      # needed) and added here — 13 of the 14 below are stdlib-only; the
      # 14th (bash-node-kind-count) needs the SAME `reyn` install already
      # paid for above (#6014), so it costs nothing new. 2 of the 17 are
      # NOT here — see this file's own exclusion note further down for
      # why, and #6117's own comment for the third correction (`mypy
      # (ratchet)` was miscounted into the 17 in #6113 — it already runs
      # unconditionally on every PR via `test.yml`, no `paths:` filter, so
      # it already had a discovery path and needs no entry here).
      - name: audit-event-firing-condition
        if: ${{ !cancelled() }}
        run: python scripts/audit_event_firing_condition_gate.py

      - name: bash-node-kind-count-ratchet
        if: ${{ !cancelled() }}
        run: python scripts/bash_node_kind_count_ratchet.py

      - name: ci-role-declared
        if: ${{ !cancelled() }}
        run: python scripts/check_ci_role_declared.py

      - name: faulthandler-timer-api-single-caller
        if: ${{ !cancelled() }}
        run: python scripts/check_faulthandler_timer_api_single_caller.py

      - name: load-yaml-vocabulary
        if: ${{ !cancelled() }}
        run: python scripts/check_load_yaml_vocabulary.py

      - name: media-store-unlink-single-caller
        if: ${{ !cancelled() }}
        run: python scripts/check_media_store_unlink_single_caller.py

      - name: no-core-dep-importorskip
        if: ${{ !cancelled() }}
        run: python scripts/check_no_core_dep_importorskip.py

      - name: silent-except-ratchet
        if: ${{ !cancelled() }}
        run: python scripts/silent_except_ratchet.py

      - name: silent-except-return-reachability
        if: ${{ !cancelled() }}
        run: python scripts/check_silent_except_return_reachability.py

      - name: suspected-time-dependence-ratchet
        if: ${{ !cancelled() }}
        run: python scripts/suspected_time_dependence_ratchet.py

      # No `--check-growth` here (unlike this gate's own per-PR workflow,
      # which passes `--check-growth "origin/${{ github.base_ref }}"`) —
      # that flag needs a base ref to diff AGAINST, the same "no PR here to
      # diff against" reason `tests-dir-names-gate` is excluded above. The
      # bare form still checks the CURRENT measured counts against the
      # committed baseline (the same skeleton `mypy_ratchet.py`'s own
      # `--full`, argument-free invocation uses) — a real, narrower check,
      # not a no-op: it still fails on a baseline the tree no longer
      # matches, it just cannot ALSO catch a same-PR baseline edit gamed
      # without a matching measured change (that half of the gate stays
      # per-PR-only, same as it always was).
      - name: tui-reactive-ratchet
        if: ${{ !cancelled() }}
        run: python scripts/check_tui_reactive_ratchet.py

      - name: tui-widget-boundary
        if: ${{ !cancelled() }}
        run: python scripts/check_tui_widget_boundary.py

      - name: unfiltered-caplog-consumption
        if: ${{ !cancelled() }}
        run: python scripts/check_unfiltered_caplog_consumption.py

      - name: user-facing-lang
        if: ${{ !cancelled() }}
        run: python scripts/user_facing_lang_gate.py
