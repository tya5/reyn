name: main hourly gate sweep

# #4257: 5 of the whole-tree gate scripts (bare-tests-import-reference,
# fastmcp-import-boundary, file-depth-reference, tests-path-literal-reference,
# flat-tests-ratchet) normally run on `pull_request` only. With strict=false
# (#4239) a PR merges on its own green, so a violation created by the
# COMBINATION of two independently-green PRs is never caught at merge time —
# the next PR to touch that path inherits a red gate an innocent change
# didn't cause. This workflow re-runs those 5 against `main` on an hourly
# schedule (plus workflow_dispatch for an on-demand check) so that
# composition gap has a witness, without adding `push: branches: [main]` to
# the 5 existing per-PR workflows (owner: keep this in ONE new file, don't
# touch them).
#
# #4965/#4966 adds a 6th, collect-events-settle
# (collect-events-settle-gate.yml) — same reasoning, and its own
# `pull_request` trigger is additionally PATH-scoped (tests/**,
# src/reyn/core/events/**), so the composition gap this workflow closes is
# even easier to hit for it: two independently-green PRs that each touch
# only ONE of those two paths never trigger the per-PR gate at all for the
# OTHER path's half of the violation.
#
# Deliberately only 5+1 of #4257's original scan — one other candidate,
# tests-dir-names-gate, invokes its script with a diff/merge-base argument
# (`--base origin/<PR base ref>` / a merge-base comparison) that has no
# meaning against `main` alone: there is no "PR" here to diff against, and
# passing any other ref would not actually stand in for one. Left out, not
# silently dropped — see the PR body for the same reasoning recorded where
# a reviewer will read it. (#4257's scan actually found 7 candidates; the
# 7th, migration-diff-shape-gate, was the SAME shape as tests-dir-names-gate
# here and excluded for the same reason — it no longer exists at all,
# removed by #4492 once #3879 Stage 1 completed and the gate's own
# `removed_by` condition was met.)
#
# `check-pr-closing-intent` / `dogfood-finding-triage` are excluded for the
# same reason #4257's issue body gives: the former inspects a PR body (main
# has no such artifact — running it would be an always-green check watching
# nothing), the latter isn't `pull_request`/`push`-triggered at all.
#
# Deliberately NOT a required status check (not referenced from branch
# protection) — this runs on a schedule independent of any one PR, so
# folding its result into a PR's merge gate would block merges on an
# unrelated periodic run.
#
# #5479 (architect, self-correcting #5435/#5466's own acceptance basis):
# `schedule` alone measured 2.7-12.8h between runs (GitHub's scheduler
# under load), not the ~1h a reader of "hourly" would assume — the
# composition-gap witness this workflow exists to provide could lag a
# real break by up to ~13h. `push: branches: [main]` is ADDED below
# (schedule stays, as the backstop for a run GitHub's scheduler drops
# entirely) so the same 6-script sweep also runs once per merge, with no
# delay. Cost: 1 extra workflow run per merge to main, a SINGLE job
# running 6 scripts in sequence (never a matrix) — a different order of
# magnitude from #4239's saturation concern, and #4257's owner ruling
# ("don't touch the 5 existing per-PR workflows, keep this in one new
# file") is untouched — only this one file's own trigger changes.
# `pytest` itself (test.yml, `on: push: branches: [main]`) already runs
# with no delay; only these 6 path-scoped, whole-tree gates were ever
# subject to the ~13h lag — never read this fix as "main could go a
# half-day without any signal at all".
#
# Deliberately NOT renamed in this PR (architect, verbatim): "hourly" is
# already inaccurate now, but the rename lands together with #5480's own
# step migration, in ONE PR — splitting them would leave a half-accurate
# name standing for the gap between, and #5480 already touches repo
# config inspection, so settling "what does this sweep actually mean"
# once, at that point, costs one PR instead of two.
on:
  schedule:
    # GitHub's own scheduler is best-effort under load — "roughly hourly",
    # not "always at :00". See the module comment above for why that's fine
    # here (this is a composition-gap witness, not a merge gate) — kept as
    # the backstop for a run GitHub's scheduler drops entirely, alongside
    # `push` below (#5479).
    - cron: "0 * * * *"
  # #5479: runs the same 6-script sweep once per merge to main, with no
  # delay — `schedule` alone could lag a real composition break by up to
  # ~13h (measured). See the module comment above for the full account.
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gate-sweep:
    name: main hourly gate sweep
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # All 6 are stdlib-only (ast / pathlib / sys) — no pip install needed,
      # same as their per-PR counterparts. Any non-zero exit fails its own
      # step (default `run:` behaviour), which reddens the job overall — a
      # single red gate is enough, #4257's own test-plan requirement ("a
      # red gate you can't fail is a gate that says nothing"). Each step
      # still carries `if: ${{ !cancelled() }}` so a step 1 failure does
      # NOT skip steps 2-6 (the default without it) — this runs once an
      # hour, so knowing all 6 outcomes from one run matters more here than
      # in a per-PR gate: without it, only the first failure is visible and
      # recovery has to wait a full cycle to learn about the rest.
      - name: bare-tests-import-reference
        if: ${{ !cancelled() }}
        run: python scripts/check_bare_tests_import_reference.py

      - name: fastmcp-import-boundary
        if: ${{ !cancelled() }}
        run: python scripts/check_fastmcp_import_boundary.py

      - name: file-depth-reference
        if: ${{ !cancelled() }}
        run: python scripts/check_file_depth_reference.py

      - name: tests-path-literal-reference
        if: ${{ !cancelled() }}
        run: python scripts/check_tests_path_literal_reference.py

      - name: flat-tests-ratchet
        if: ${{ !cancelled() }}
        run: python scripts/flat_tests_ratchet.py

      - name: collect-events-settle
        if: ${{ !cancelled() }}
        run: python scripts/check_collect_events_settle.py

      - name: cancel-swallow
        if: ${{ !cancelled() }}
        run: python scripts/check_cancel_swallow.py
