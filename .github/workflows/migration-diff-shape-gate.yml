name: migration-diff-shape gate

# #3879 Stage 1 M1 (PR-0). TEMPORARY, unlike flat-tests-ratchet.yml: this
# gate only makes sense while Stage-1 migration PRs are landing (a
# legitimate PR deleting a Tier-4 test after Stage 1 is done would be
# wrongly blocked by it). Same lifespan discipline as tests/scaffold/'s
# triggered_by/removed_by convention:
#
#   triggered_by: #3879 Stage 1
#   removed_by:   the PR that lands the LAST Stage-1 migration
#
# Not wired into the normal test.yml matrix — this is a repo-process gate,
# not a test-suite gate, and needs full git history (fetch-depth: 0) to
# diff against the merge-base, unlike test.yml's shallow checkout.
#
# The `paths:` filter below only prunes PRs that don't touch tests/ at all —
# it does NOT distinguish a migration PR from an ordinary edit among PRs
# that do. That distinction is made INSIDE the script, from the diff's own
# content (at least one pure R100 rename under tests/), never from a label
# or branch-name declaration — see check_migration_diff_shape.py's module
# docstring, "Activation" section (lead-coder's #3885 review correction,
# after an earlier version of this workflow fired on every tests/-touching
# PR, including ordinary Q3/Q4 assert-repair PRs). A PR with no such rename
# reaches the script and gets an immediate "gate inactive" pass, not a
# workflow-level skip — the two look the same in the CI check list, but the
# distinguishing logic lives in one place (the script), not duplicated here.
on:
  pull_request:
    paths:
      - "tests/**"
      - "scripts/flat_tests_baseline.json"

permissions:
  contents: read

jobs:
  migration-diff-shape:
    name: migration-diff-shape gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # scripts/check_migration_diff_shape.py is stdlib-only (argparse /
      # subprocess). No pip install needed.
      - name: Check the PR's diff is pure moves (Stage 1 migration shape)
        run: |
          python scripts/check_migration_diff_shape.py --base "origin/${{ github.base_ref }}"
