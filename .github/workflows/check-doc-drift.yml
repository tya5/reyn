name: Doc-drift check

# #5003: flag a PR that removes an identifier from src/ without touching
# any docs/ file that still names it. See
# scripts/check_doc_drift.py's module docstring for the discriminator
# (asks the PR, not the doc) and the structural exclusions.
#
# WARN-ONLY (architect ruling 2026-08-21, REVERTING the same day's
# earlier promotion — #5010). Full account in
# scripts/check_doc_drift.py's module docstring, "Blocking" section
# (kept, corrected in place — do not re-derive from PR history alone).
#
# The promotion's decisive point ("the passing action is always
# correct — no dead end") was falsified within hours: all 3 "true
# positives" in the #5010 calibration set — PR #4572, PR #4567, PR
# #4563, each individually re-checked today — turned out to be the
# SAME FALSE POSITIVE cited three times, on independent
# re-measurement. `docs/reference/runtime/session-construction.md` is
# CURRENTLY ACCURATE (correctly phrased as a historical rename note;
# #5016, closed). The doc WAS stale right after PR #4572 merged (the
# actual removal), but a LATER PR (#4582) already fixed it into
# permanently-correct historical prose — a case the discriminator
# structurally cannot see, because it only asks "did THIS removing PR
# touch the doc", never "has ANY later PR already fixed it since". A
# PR merged today that happens to remove another already-historical
# `_action_retrieval`-shaped identifier gets flagged with NO valid
# fix — touching the doc again would mean writing something false,
# since it is already correct. That is the dead end promotion assumed
# could not exist. Corrected calibration count: **3 FP / 9, 0 TP
# remaining** (was reported as 3 TP / 0 FP) — the naive "staged,
# multi-PR removal" case is a DIFFERENT false-positive class than the
# two (comment prose, docstring prose) round 2 actually closed;
# re-promotion needs its own structural discriminator for THIS class,
# not another metric
# push. See #5010 for the corrected record and re-promotion status.
#
# Trigger scoped to `paths: ["src/**"]` — the discriminator only ever
# considers identifiers removed from src/, so a PR that never touches
# src/ cannot produce a finding; running the job anyway would just be a
# nonzero-cost no-op every time.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    paths:
      - "src/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  doc-drift:
    name: doc-drift check (warn-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # fetch-depth: 0 (full history) — the precise extraction path
      # reads real pre/post file content via `git show <sha>:<path>`,
      # which needs the base ref's commit present locally; the default
      # shallow (depth 1) checkout would only have the PR's own tip
      # commit and make every file fall back to the line heuristic
      # (logged, not silent, but pointless to pay for every run when a
      # full checkout avoids it).
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # scripts/check_doc_drift.py is stdlib-only (argparse / re /
      # subprocess, `git`/`gh` as external tools). No pip install needed.
      - name: Check for src/ identifiers removed without a docs/ touch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python scripts/check_doc_drift.py --pr "${{ github.event.pull_request.number }}" > doc_drift_output.txt 2>&1
          exit_code=$?
          cat doc_drift_output.txt
          if [ "$exit_code" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::warning::${line}"
            done < <(grep "^  '" doc_drift_output.txt)
          fi
          exit 0
