name: behind-files report

# #5419: report which files a PR's branch is BEHIND main on — a file the
# branch never itself touched, but main has since moved. See
# scripts/detect_5419_behind_files.py's module docstring for the
# discriminant (two-dot minus three-dot file sets), its own non-vacuity
# positive control, and — importantly — the "Corrected framing" section:
# an earlier revision of this workflow called this set "revert
# candidates" and that framing was WRONG (falsified during PR #5420's
# own review: real merge commits for #5415/#5417 deleted zero files, and
# `git merge-tree` on #5418 showed main's current text surviving). This
# set answers "is the branch behind", never "will merging revert
# anything" — do not reintroduce revert language here.
#
# WARN-ONLY, same shape as check-doc-drift.yml (architect ruling, #5419
# §3): `BEHIND` is routine and mostly harmless — GitHub's merge usually
# resolves it correctly. This workflow only ever annotates; it never
# fails the job, and carries no `pull-requests: write` permission — it
# cannot post a PR comment even if a future edit tried to.
#
# Trigger includes `synchronize` (not just `opened`) because a stale
# BEHIND branch is typically discovered AFTER a later `update-branch` or
# push — the same event `check-pr-closing-intent.yml` re-runs on for the
# same reason (an author's later edit needs the gate to re-evaluate).
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  behind-files-report:
    name: behind-files report (warn-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # fetch-depth: 0 (full history) — the two-dot/three-dot diffs need
      # both the PR's base and head commits, and their shared merge-base,
      # present locally; a shallow checkout would make every comparison
      # fail with "unknown revision".
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # scripts/detect_5419_behind_files.py is stdlib-only (argparse /
      # json / subprocess, `git`/`gh` as external tools). No pip install
      # needed.
      - name: Report behind-files (never blocks)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python scripts/detect_5419_behind_files.py --pr "${{ github.event.pull_request.number }}" > behind_files_output.txt 2>&1
          exit_code=$?
          cat behind_files_output.txt
          if [ "$exit_code" -eq 1 ]; then
            while IFS= read -r line; do
              echo "::warning::${line}"
            done < <(grep '^  - `' behind_files_output.txt)
          fi
          exit 0
