  # axis:[precision] to axis:[call_rate] (test_embedding_bench_manifest.py's
  # own documented escape hatch: "move to a non-precision axis" for
  # dynamic-enumeration-only actions), matching the existing call_rate-only
  # convention used below for discovery-path-matters-more-than-invoke cases.
  - id: agent_delegation_simple
