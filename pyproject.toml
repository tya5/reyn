[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reyn"
version = "0.1.0a2"
description = "LLM-driven phase execution engine with a Markdown DSL"
requires-python = ">=3.11"
license = { text = "MIT" }
readme = "README.md"
authors = [
    { name = "Tetsuya Yasuda" },
]
keywords = [
    "llm",
    "agent",
    "workflow",
    "dsl",
    "multi-agent",
    "orchestration",
    "os",
    "phase",
    "LLM workflow",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System",
    "Typing :: Typed",
]

dependencies = [
    "litellm>=1.89.3",  # #3288 follow-up: floor raised for litellm's native
                        # /v1/responses auto-bridge (BerriAI/litellm#23577,
                        # merged 2026-03-13) — reyn's own manual bridge (#1678)
                        # was deleted in favor of delegating to this; an older
                        # litellm would silently lack the bridge reyn now
                        # relies on for reasoning+tools calls.
    "pydantic>=2.0",
    "jsonschema>=4.0",
    "pyyaml>=6.0",
    "prompt_toolkit>=3.0",   # plain CUI (--cui flag) keeps this
    "ddgs>=8.0",
    "rich>=13",              # inline CUI renderer — DIRECT dep (plain renderer imports it).
                             # Kept explicit deliberately: textual is back in the tree
                             # transitively via textual-flowview (below), and rich would
                             # otherwise silently revert to "transitive via textual" — but
                             # the plain renderer uses rich directly, independent of textual.
    # TUI-rebuild arc (#3273): the interactive TTY conversation pane
    # (`reyn.interfaces.inline.textual_chat`) is a Textual app built on the
    # textual-flowview primitives (Presentation.background, FlowView(spacing=)).
    # Git-pinned to a specific commit of the PUBLIC repo (no auth needed).
    # Phase 1 promotes `textual` to an explicit DIRECT dep now that the app code
    # imports `textual.app`/`textual.widgets` directly (Phase 0 left it transitive
    # via flowview) — same reasoning that keeps rich direct above. Floor matches
    # flowview's own requirement (textual>=0.80). The app module is imported
    # LAZILY on the TTY path only, so the plain / --cui / non-TTY / CI paths never
    # touch textual or flowview and stay green even if flowview fails to resolve.
    "textual>=0.80",
    # v0.12.0 (5a72da0), up from v0.9.0 (#3624). 0.5.0: animated jumps,
    # body_width/effective gutter widths. 0.6.0: empty state,
    # scroll_to_entry(align=), opt-in keyboard cursor, ReachedTop/ReachedBottom
    # infinite scroll, insert_many/extend. 0.9.0: O(1) differential reflow
    # (Viewport.invalidate_height_of dirties only the prefix-sum offsets from
    # the changed entry onward) — internal, so reyn's existing set_item path
    # gets it with no call-site change; plus Entry.patch_rows /
    # Presentation(strips=) (NOT wired here — deferred pending #3539) and
    # body-only text selection (the gutter is decoration, so a yank no longer
    # carries gutter glyphs). 0.10.0: copy mode half/full-page scroll
    # (Ctrl-D/U/F/B) — adopted implicitly (reyn declares no motion binding of
    # its own, so upstream's keymap growing is a no-op change here); and
    # FlowView(copy_mode=True) — looked at, DECLINED (reyn's `c` toggle is the
    # deliberate entry point; always-on would bypass the ordinary
    # conversation-cursor keys). 0.11.0: keyboard highlight and mouse
    # selection unified into one `selectable=` cursor — a click now MOVES and
    # COMMITS it, so `Selected` fires on a click exactly like Enter/Space with
    # nothing to tell them apart; reyn no longer reads `Selected` for its
    # clipboard-copy handler (a naive port would let a stray click overwrite
    # the user's clipboard) — see `_CursorFlowView` in
    # `textual_chat/app.py` and "Textual TUI keyboard cursor" in
    # `docs/reference/runtime/agui-transport.md`. 0.12.0: removed the 0.11.0
    # back-compat aliases (`highlight=`, `.highlighted`/`.selected`,
    # `.select()`, `.clear_selection()`, `.highlight_entry()`/`move_highlight()`
    # /`highlight_first()`/`highlight_last()`, `FlowView.Activated`,
    # `flowview--selected`) — pure rename onto the 0.11.0 names reyn had
    # already adopted, no further behaviour change. All additive; defaults
    # unchanged (cursor=False, empty=None, animate=False) — #3476 adoption arc.
    # 0.13: "refactor!: replace copy mode with always-on text cursor + visual
    # mode" — there is no copy_mode to enter/leave any more; the vim movement
    # keys are always live, `c` (upstream) shows/hides the cursor block, and
    # visual mode (`v`/`V`…`y`) is the one real mode. Removed:
    # enter/exit/toggle_copy_mode, the `copy_mode` prop/flag, `CopyModeChanged`,
    # the `copy_` method prefix. New: show_cursor/hide_cursor/toggle_cursor/
    # cursor_visible + `cursor=`. reyn's own copy-mode BINDINGS/state/handler
    # are removed with this pin bump (#3692 PR-A) — `c` is no longer reyn's to
    # declare, and yank is `y` (flowview's own), not a reyn-side alias. 0.13.1
    # fixes the addressed-row-rail regression 0.13.0 introduced (`c` moved the
    # addressed row; 0.13.1 moves the cursor onto `current` via `set_current`
    # instead) — pinned straight to 0.13.1, 0.13.0 was never released to reyn.
    # 0.14.0 (#3784) exposes `following`/`FollowChanged` and fixes the
    # early-scroll-release bug; reyn's tail-away indicator drives off that
    # event rather than the per-frame geometry poll it replaced. (This entry
    # is retrospective — #3784 moved the pin without extending this narrative,
    # so the comment described 0.13.1 while the pin was 0.14.0.)
    # 0.15.1 adds a viewport overlay API (`play_overlay` / `stop_overlay` /
    # the `overlay` property / `OverlayFinished`) and nothing else. There is no
    # `set_overlay` — this comment named one until #3841 checked it against
    # `_view.py`; the setter is the `overlay` property's, not a method.
    # Verified as no-change-for-reyn from
    # the DIFF, not from the release notes: `__all__` is untouched (only
    # `__version__` moved), the sole deleted line in `_view.py` is an import
    # widening (`Callable` -> `Callable, Iterator`), and the two insertions
    # that land inside EXISTING methods — `on_unmount` and `render_line` — are
    # both guarded on overlay state that initialises to None and is written
    # only by the overlay API. reyn references none of those three names, so
    # both guards are permanently false and the render path is unchanged.
    # "The changelog says additive" would not have established that: an
    # insertion into `render_line` is a change to the hot path whatever the
    # release notes call it.
    # 0.15.2 / 0.15.3 are DOCS-ONLY for the library: the whole diff
    # 503a536->21c6a1c is CHANGELOG/README, two new `examples/`, and the version
    # string in `pyproject.toml` + `__init__.py`. Nothing under
    # `src/textual_flowview/` changes behaviour, so the bump cannot regress reyn.
    # It is taken for what the examples ESTABLISH rather than for library code:
    # `examples/image.py` shows a Rich renderable (textual-image, built from a
    # PIL image IN THE CLIENT PROCESS) dropped into a `Presentation`, and
    # `examples/gif.py` shows `animate_entry` driving frames with off-screen
    # auto-pause. Both are the upstream demonstrating a usage reyn's own image
    # work (#3811 and the present-op `image` component) needs to know is
    # supported — "the library did not change" is a reason not to fear the bump,
    # not a reason to skip it.
    # The SHA is the *commit*, not the tag object: v0.13.1/v0.12.0 are
    # LIGHTWEIGHT tags (no `^{}` peel in `git ls-remote`), same as v0.9.0,
    # unlike the annotated v0.7.0/v0.8.0.
    "textual-flowview @ git+https://github.com/tya5/textual-flowview.git@21c6a1caf6b216dfbba89ac12aa9310b0c759909",
    "numpy>=1.24",           # RAG index backend cosine similarity (ADR-0033)
    "croniter>=2.0",         # cron expression parsing for FP-0009 Component B
    "charset-normalizer>=3.0",  # #1452 read_file encoding detection (MIT, pure-python)
    "fastmcp==3.4.2",        # MCP client is a first-class capability Session.__init__ always constructs (import chain: session -> mcp.connection_service -> mcp.message_handler -> fastmcp), so fastmcp is effectively required — promoted from the former [mcp] extra so a core `reyn chat` no longer ImportErrors on fresh installs.
    "pyperclip>=1.9",        # #3616 ①: cross-platform clipboard, replacing a
                              # hand-rolled pbcopy/wl-copy/xclip/xsel/clip
                              # dispatch table whose Windows arm piped UTF-8
                              # to clip.exe (which decodes stdin under the OEM
                              # code page, garbling non-ASCII). pyperclip's
                              # Windows backend writes CF_UNICODETEXT directly.
                              # Linux still needs xclip/xsel/wl-clipboard on
                              # PATH — pyperclip does not vendor them either.
]

[project.urls]
Homepage = "https://tya5.github.io/reyn/"
Documentation = "https://tya5.github.io/reyn/docs/"
Repository = "https://github.com/tya5/reyn"
Issues = "https://github.com/tya5/reyn/issues"
Changelog = "https://github.com/tya5/reyn/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "pytest-xdist>=3.5",
    "pytest-timeout>=2.2",
    "ruff",
    "mypy",
    "pytest-asyncio>=0.23",
    "pre-commit>=3",
    "markdown>=3.6",  # #3126: doc-anchor CI gate imports the canonical
                       # markdown.extensions.toc.slugify_unicode/unique
                       # functions directly — the same slugify mkdocs' `toc`
                       # extension (docs extra) uses at build time. A pure-
                       # python leaf dep, listed here (not `docs`) so `pytest`
                       # (installed via this extra in CI) has it without
                       # pulling the mkdocs-material/i18n toolchain.
]
fetch = [
    "trafilatura>=1.8",       # higher-quality HTML extraction for web_fetch (issue #355)
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocs-static-i18n>=1.2",
]
web = [
    # #1621: upper-bounds pin (owner steer) — CI's unpinned resolve pulled
    # fastapi 0.137 + starlette 1.3.1, whose ``_IncludedRouter`` in ``app.routes``
    # breaks the flat route-introspection the web tests assert on. Pin below 1.3
    # (the introducing release; local 1.0.0 + the highest <1.3 are working) and
    # cap fastapi <0.137 (the release that floors starlette to 1.3) so CI is
    # reproducible. starlette pinned directly (it is a transitive of fastapi).
    # forward-migration to the new route model is a separate optional follow-up.
    "fastapi>=0.110,<0.137",
    "starlette>=1.0,<1.3",
    "uvicorn[standard]>=0.27",
    "websockets>=12",
]
# `mcp` is now a no-op back-compat alias: `fastmcp` moved into core `dependencies`
# above (the MCP client is always constructed by `Session.__init__`). Kept as an
# empty extra so existing `pip install -e ".[mcp]"` invocations (CI, user docs,
# `reyn[mcp]`) keep resolving instead of erroring on an unknown extra.
mcp = []
# ADR 0064 P5 (grew out of FP-0063 P2) -- the runtime deps of the builtin
# `rag` PLUGIN's two MCP servers (`src/reyn/builtin/plugins/rag/scripts/`:
# vector-store over sqlite-vec, chunker over chonkie). These are NO LONGER
# a runtime path reyn's own env needs: `plugin_install(source={"kind":
# "builtin", "name": "rag"})` materialises them into a DEDICATED per-plugin
# venv (`~/.reyn/plugins/rag/.venv`, from the plugin's own
# `requirements.txt`) at install time, so a user's `pip install reyn` (or
# `reyn[builtin-rag]`) never needs to resolve them, and reyn core never
# imports them. This extra survives ONLY as a dev/test convenience so this
# repo's OWN unit tests (tests/test_fp0063_p2_builtin_mcp_rag.py and the
# rag-plugin install tests) can import chonkie/apsw/sqlite-vec directly
# without a `uv`-materialised venv in the loop -- it is not part of the user
# launch path and is not referenced by any `[project.scripts]` entry point.
#   - sqlite-vec (dual MIT/Apache-2.0): pure-C SQLite extension, no bundled
#     embedding model -> no HuggingFace-fetch hazard (FP-0057 line 55).
#   - apsw (zlib-like "any-OSI"): sqlite-vec loads via
#     `sqlite3.Connection.load_extension`, which the STDLIB `sqlite3` module
#     is not guaranteed to support (e.g. this repo's own pyenv-built
#     CPython 3.12.7 .venv has no `enable_load_extension`). apsw statically
#     bundles its own SQLite with extension loading always enabled, so
#     loading is portable regardless of how the host interpreter's `sqlite3`
#     was compiled.
#   - chonkie (MIT): recursive/semantic/etc. chunking, ~15 MiB vs LangChain's
#     ~80 MiB; no bundled model in the default character-tokenizer path used
#     here -> no network fetch at import or call time.
builtin-rag = [
    "sqlite-vec>=0.1.9",
    "apsw>=3.51",
    "chonkie>=1.7",
]
# #2608 H4: filesystem watcher external-event source (`fs_watch:` config block ->
# `file_changed` hook). Extras-only — a build with no fs_watch config configured
# never imports this, and a build WITH config but no extra installed degrades to
# "feature off + warn" (see reyn.runtime.fs_watcher module docstring).
fs-watch = ["watchdog>=4.0"]
release = [
    "build>=1.0",
    "twine>=5.0",
]
sandbox-linux = [
    # No stable landlock >=1.0 exists on PyPI — only 1.0.0.dev* pre-releases.
    # A specifier that names a pre-release opts this requirement into them
    # (PEP 440), so `>=1.0.0.dev4` installs where a bare `>=1.0` resolves to
    # nothing (pip excludes pre-releases by default). #1693.
    "landlock>=1.0.0.dev4",
    "pyseccomp>=0.1",
]
voice = [
    "sounddevice>=0.4.6",
    "faster-whisper>=1.0.0",
]
# #3796: the full-viewport text effect on ctrl+l — a joke, and the only thing
# in reyn that wants an animation library. Its own extra rather than a core
# dependency (owner ruling, 2026-08-08「依存は extra かな」): not everyone who
# installs reyn should carry a dependency for a joke. Without it the key says so
# and names this extra, so the feature is discoverable without being installed.
effects = [
    "terminaltexteffects>=0.12",
]
# OpenTelemetry (OTLP) export surface — opt-in observability. Reyn core stays
# SDK-free unless an operator activates OTEL export (an OTLP endpoint plus this
# extra); when the SDK isn't installed the exporter stays not-attached, fail-open.
observability = [
    "opentelemetry-exporter-otlp-proto-http>=1.20",
    "opentelemetry-sdk>=1.20",
]
# FP-0041 #489 plugins-api PR-2: sample webhook plugins use OSS SDKs.
# Reyn core stays SDK-free for operators who don't activate the
# samples; SDK deps are opt-in via these extras:
#
#   pip install reyn[sample_slack]      # = reyn + slack-bolt
#   pip install reyn[sample_line]       # = reyn + line-bot-sdk
#   pip install reyn[all-samples]       # = reyn + both
#
# When the SDK isn't installed, ``register_router`` returns ``None``
# with a clear log message; reyn boots without crashing.
sample_slack = ["slack-bolt>=1.18"]
sample_line = ["line-bot-sdk>=3.0"]
all-samples = ["slack-bolt>=1.18", "line-bot-sdk>=3.0"]

[project.scripts]
reyn = "reyn._cli:main"
# Builtin RAG MCP server console scripts (`reyn-rag-chunker` /
# `reyn-rag-vector-store`, #2972) are RETIRED under ADR 0064 P5 -- the
# console-script approach bound the servers to reyn's OWN environment
# (needed `pip install "reyn[builtin-rag]"` into reyn's env), which is
# exactly the coupling the plugin model exists to remove. The builtin `rag`
# plugin's `.mcp.json` instead declares `command: python` against a path
# inside the plugin's own copy; `plugin_install` materialises a DEDICATED
# per-plugin venv and rewrites that command to the materialised venv's own
# interpreter, so spawn is network-free without depending on the ambient
# PATH's `python3` OR on reyn's console-script shebang trick (ADR 0064
# §3.11 / §4). See `src/reyn/builtin/plugins/rag/`.

# FP-0041 #489 plugin framework: sample webhook plugins bundled with reyn.
# External plugins register the same way via their own pyproject.toml.
[project.entry-points."reyn.webhooks"]
sample_slack = "reyn.gateway.sample_slack:register_router"
sample_line = "reyn.gateway.sample_line:register_router"

# FP-0041 #489 plugins-api PR-2: sample plugins now use OSS SDKs for
# transport-specific protocol (= slack-bolt / line-bot-sdk). Installed
# via optional pip extras so reyn core stays SDK-free for operators
# who don't activate the samples:
#
#   pip install reyn[sample_slack]      # = reyn + slack-bolt
#   pip install reyn[sample_line]       # = reyn + line-bot-sdk
#   pip install reyn[all-samples]       # = reyn + both
#
# When the SDK isn't installed, ``register_router`` returns ``None``
# with a clear log message so reyn boots without crashing.

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["src"]
# dogfood/fixtures/ ships failing-test workspaces consumed by
# dogfood/scripts/ runners on isolated tmp copies. They MUST NOT
# be collected by the project's main pytest suite — the placeholder
# stubs (= NotImplementedError) would fail CI at collection time.
#
# .claude/worktrees/ holds transient git worktrees created by the Agent
# tool's `isolation: "worktree"` mode (gitignored, local-only). Each is a
# full copy of the tree at some other branch state, so a rootdir
# `pytest -q` would otherwise collect tens of thousands of stale-import
# test modules. Declaring an explicit norecursedirs drops pytest's default
# `.*` dotdir exclusion, so `.claude` (and `.reyn`) must be listed back.
norecursedirs = ["dogfood/fixtures", ".reyn", ".claude", "reyn-worktrees"]

# Hatchling build config (0061 §3.1 — replaces the former
# [tool.setuptools.packages.find] / [tool.setuptools.package-data] / setup.py
# build_py cmdclass trio). `packages` maps 1:1 to the old `packages.find`
# clause; the three `artifacts` entries preserve — byte-for-byte — the old
# `package-data` glob (py.typed, builtin/**/*, environment/*.Dockerfile).
# `artifacts` (not `include`) is used deliberately: it forces inclusion
# regardless of Hatchling's default VCS-tracked-file selection, so these three
# entries can never silently drop out if a future file under one of these
# globs is untracked/gitignored (the top omission risk called out in 0061
# §3.1 — dropping any of the 3 = a silently-broken wheel).
# Allow the git-pinned `textual-flowview @ git+https://...@<sha>` direct
# reference in `project.dependencies` (TUI-rebuild arc Phase 0, #3273).
# Hatchling refuses direct (URL/VCS) references by default; this opt-in is
# required for the pinned-commit flowview dep to build/resolve.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/reyn"]
artifacts = [
    "src/reyn/py.typed",
    "src/reyn/builtin/**/*",
    "src/reyn/environment/*.Dockerfile",
]

# 0061 §3.2/§3.3 — the reachable-set SSoT: docs-delivery force-include below
# mirrors `reyn.runtime.reyn_src.FORCE_INCLUDE_ENTRIES` (the single Python
# declaration; TOML can't import Python, so the two are kept in sync by
# construction of the parity gate in tests/test_0061_repo_self_access_parity.py,
# which fails if the two drift). `docs/` stays at the repo root (mkdocs
# `docs_dir: ../docs` unaffected) — this only maps it into the wheel's
# installed tree.
[tool.hatch.build.targets.wheel.force-include]
"README.md" = "reyn/_bundled/README.md"
"CHANGELOG.md" = "reyn/_bundled/CHANGELOG.md"
"docs" = "reyn/_bundled/docs"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    "venv",
    ".venv",
    "site",
    "dist",
    "build",
    "tmp",
    "zenn-book",
    ".claude",
]

[tool.ruff.lint]
# Pyflakes (real bugs) + import sorting only. The pycodestyle style
# rules (E501 long lines, E402 module-level imports, E741 ambiguous
# names) are intentionally not enforced — we keep the line-length
# target as a guideline rather than a hard rule, since wrapping
# Reyn's narrative comments and skill scripts often hurts
# readability more than it helps.
select = ["F", "I"]
ignore = [
    # F401: re-exports in __init__.py and TYPE_CHECKING blocks make
    # these false positives common.
    "F401",
    # F811: local imports inside functions for clarity (e.g. lazy
    # imports of optional deps) trigger this.
    "F811",
    # F821: forward references in string annotations
    # (`x: "Foo | None"`) confuse pyflakes; the actual import lives
    # under TYPE_CHECKING.
    "F821",
    # F841: explicit `_ = ...` placeholders or guard variables that
    # aren't used outside an assertion are intentional.
    "F841",
]

# #3726: wired into CI as a ratchet (.github/workflows/test.yml's "mypy
# (ratchet)" job), not a blocking full-adoption gate — the tree currently
# carries 603 findings (212 unique (file, error-code) pairs), too many to
# close before adopting. scripts/mypy_ratchet.py fails CI only on a pair NOT
# already in the committed scripts/mypy_ratchet_baseline.json; see that
# script's module docstring for the full rationale (same skeleton as
# tests/test_3595_s4_slash_handler_seam.py's residue ratchet).
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
# numpy 2.x's bundled __init__.pyi uses PEP 695 `type X = ...` (3.12+-only
# syntax) internally; mypy applies the declared `python_version` restriction
# to third-party stubs too, not just first-party code, so parsing it under
# our `python_version = "3.11"` (matching `requires-python`, #3726) raises a
# real SyntaxError in numpy's OWN stub — nothing to do with our code.
# `follow_imports = "skip"` treats numpy as untyped (Any) instead of parsing
# its stub, which is the standard workaround for this exact upstream tension.
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
