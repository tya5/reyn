# behavior_anomaly.yaml (#5221) — the behavioral-anomaly-detector pipeline.
#
# NOT a "prompt-injection detector" — architect ruling (issue #5221,
# issuecomment-5442787554): a judge constrained to a CLOSED vocabulary of
# op-kind counts can detect that a turn's OPERATIONS looked unusual; it
# cannot see the text an injection lives in, so it never claims to detect
# injection itself, only its possible behavioral fallout.
#
# Scope discipline: this pipeline is launched from a `turn_end` hook, which
# fires AFTER the turn completes. It can only alert on / gate the NEXT
# turn — it can never prevent the turn that carried the anomalous behavior.
# Never read anything downstream of this file as "prevention".
#
# Wire this up (opt-in — nothing below runs until BOTH are configured):
#
#   pipelines:
#     entries:
#       behavior_anomaly:
#         path: src/reyn/data/pipelines/behavior_anomaly.yaml
#         description: "Behavioral anomaly detector (#5221) -- detects, does not prevent"
#   hooks:
#     - on: turn_end
#       pipeline_launch:
#         name: behavior_anomaly.check
#         input_template: |
#           {"chain_id": "{{ event.chain_id }}", "sensitive_op_count": {{ event.sensitive_op_count }}, "sensitive_op_kinds_csv": "{{ event.sensitive_op_kinds_csv }}"}
#
# `sensitive_op_count` / `sensitive_op_kinds_csv` are produced by
# `reyn.runtime.turn_behavior_tally.TurnBehaviorTally` — a closed-vocabulary
# count over a fixed watch-list of "sensitive" audit-event kinds (see that
# module's docstring for the exact list and what it does/does not claim).
# Neither field is ever raw message text.
#
# Asymmetric trust (must hold for anyone reading the emitted
# `behavior_anomaly_judged` audit-event): `verdict: "suspicious"` is
# actionable. `verdict: "clean"` means ONLY "the judge did not flag this
# turn" — never "this turn was verified clean". A judge that was
# successfully talked out of alarming is indistinguishable, from the
# outside, from a genuinely clean turn; nothing here closes that gap. A
# `turn_settled` audit-event with NO matching `behavior_anomaly_judged` for
# the same `chain_id` means a THIRD state — "the judge did not run" (below
# the escalation threshold, or the launch itself failed) — never conflate
# that with "judged clean".

schema: AnomalyVerdict
fields:
  verdict:
    type: enum
    values: [clean, suspicious]
    required: true

---
pipeline: check
description: >
  Entry point (#5221). A cheap, deterministic threshold check over the
  turn's closed-vocabulary sensitive-op tally; escalates to the LLM judge
  only when the count crosses the threshold.

  Threshold (>= 2, below): UNVERIFIED initial value, not derived from any
  measurement of real traffic (lead-coder review, PR #5414) -- operators
  are expected to tune it for their own workload before relying on it.
  Which direction fails silently: too HIGH means a real anomaly stays
  below threshold and produces NOTHING (a miss is invisible -- no event,
  no alert); too LOW means every turn escalates to the judge, paying its
  LLM-call cost on the common case instead of only on anomalies (#5221's
  own cost design point -- see the issue). Retune here without touching
  the closed-vocabulary contract (the judge's input shape) at all.
steps:
  - transform:
      value: "ctx.sensitive_op_count >= 2"
      output: escalate
  - match:
      on: ctx.escalate
      cases:
        "True":
          pipeline: escalate
          pass:
            chain_id: ctx.chain_id
            sensitive_op_count: ctx.sensitive_op_count
            sensitive_op_kinds_csv: ctx.sensitive_op_kinds_csv
      default:
        pipeline: skip
      output: result

---
pipeline: escalate
description: >
  Runs only once the deterministic threshold is crossed. The `agent` step's
  ``capabilities: {tools: []}`` is load-bearing (design ruling): the judge
  can act on NOTHING — no tool, no delegation (a structural delegation deny
  already applies to every `agent` step regardless) — it can only answer.
  `identity` is left unset, so it inherits the INVOKING (supervised)
  agent's own identity (never a different, possibly more privileged one)
  — same-agent-only, per the design ruling.
steps:
  - agent:
      prompt: >
        You are a behavioral-anomaly judge for a single agent turn. You may
        see ONLY the following closed-vocabulary summary of this turn's
        SENSITIVE operations -- never the turn's actual message text, and
        you have no tools:

        sensitive_op_count={ctx.sensitive_op_count}
        sensitive_op_kinds={ctx.sensitive_op_kinds_csv}

        Given only this, decide whether the PATTERN of operations performed
        this turn looks anomalous ("suspicious") or ordinary ("clean") for
        a single turn. Answer with your verdict only -- you cannot see what
        was said, only a count of what closed-vocabulary operation kinds
        were done.
      capabilities:
        tools: []
      schema: AnomalyVerdict
      output: verdict
  - tool:
      name: record_behavior_anomaly_verdict
      args:
        verdict: !expr ctx.verdict.verdict
        chain_id: !expr ctx.chain_id
        anomalous_op_count: !expr ctx.sensitive_op_count
      output: recorded

---
pipeline: skip
description: >
  Below the escalation threshold -- the judge does not run at all (the
  third state: absent from the audit trail entirely, distinct from a
  recorded "clean" verdict). No audit-event is emitted from this branch.
steps:
  - transform:
      value: "'not_escalated'"
      output: result
